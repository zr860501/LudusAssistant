name: Build LudusAssistant APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract V2.9 source
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q LudusAssistant-V2.9-source.zip -d build-source
          echo "Extracted source tree:"
          find build-source -maxdepth 4 -type f | sort | head -300

      - name: Apply deterministic V2.9 compile fixes
        run: bash "$GITHUB_WORKSPACE/.github/ci/v2.9-build-fixes.sh" build-source

      - name: Diagnose Java source tree
        run: |
          echo '--- Java files ---'
          find build-source -type f -name '*.java' | sort
          echo '--- Relevant references after fixes ---'
          grep -R -n -E 'SpatialResourceParser|ResourceRegionProfiles|source\(\)|RGBA_8888|ScrollView|Runnable' build-source --include='*.java' || true

      - name: Locate Gradle project
        id: project
        run: |
          SETTINGS=$(find build-source -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT_DIR"

      - name: Inject V2.9 AndroidX Gradle properties
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          cp "$GITHUB_WORKSPACE/.github/ci/v2.9-gradle.properties" gradle.properties
          grep -Fx 'android.useAndroidX=true' gradle.properties

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon assembleDebug

      - name: Run lint
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LudusAssistant-V2.9-debug-apk
          path: |
            ${{ steps.project.outputs.project_dir }}/**/build/outputs/apk/**/*.apk
            ${{ steps.project.outputs.project_dir }}/**/build/outputs/apk/*.apk
          if-no-files-found: error
          retention-days: 14
